          "author": { "@id": "#author" },

        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What is EdgeQA?",
              "acceptedAnswer": { "@type": "Answer", "text": "EdgeQA turns any GitHub repository into a secure, shareable QA environment — no deploys, no servers. A service worker serves the repo's files straight from GitHub into a sandboxed preview, and testers can file issues in context." }
            },
            {
              "@type": "Question",
              "name": "Does EdgeQA upload or store my code?",
              "acceptedAnswer": { "@type": "Answer", "text": "No. Everything runs in your browser: files are fetched from GitHub by a service worker and served locally, so nothing is uploaded, proxied, or stored anywhere." }
            },
            {
              "@type": "Question",
              "name": "Is EdgeQA free? Do I need a token?",
              "acceptedAnswer": { "@type": "Answer", "text": "Free and open source (MIT). Public repos preview with no token at all; private repos need a fine-grained GitHub PAT with Contents: Read, which stays in browser memory and is never sent to a server." }
            },
            {
              "@type": "Question",
              "name": "Which frameworks can EdgeQA preview?",
              "acceptedAnswer": { "@type": "Answer", "text": "Static sites work as-is. React, Preact, JSX/TSX, Vue 3, and Svelte source repos are transpiled in the browser (experimental), with auto-detected aliases, dependency pinning, and a client-side router fix. Angular, Solid, and apps that need a real build step (Sass preprocessing, virtual modules) degrade cleanly." }
            },
            {
              "@type": "Question",
              "name": "Can AI agents or CI create QA links?",
              "acceptedAnswer": { "@type": "Answer", "text": "Yes — the site exposes a WebMCP tool (create_qa_link) that WebMCP-capable agents can call, and the link format itself is a simple URL hash anyone can construct (see the README)." }
            }
          ]
        },
